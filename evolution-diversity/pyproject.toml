[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evolution-diversity"
version = "0.1.0"
description = "Code for 'The Secret Ingredient in Evolutionary Algorithms? Diversity.' blog post"
requires-python = ">=3.11, <3.13"
dependencies = [
    "numpy",
    "matplotlib",
    "Pillow",
]

[tool.hatch.build.targets.wheel]
packages = ["animations"]
